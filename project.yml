name: MacTV
options:
  bundleIdPrefix: com.mactv
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: "Mac TV"
    INFOPLIST_KEY_CFBundleDisplayName: "Mac TV"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    ENABLE_APP_SANDBOX: NO
targets:
  MacTV:
    type: application
    platform: macOS
    sources:
      - Sources/MacTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mactv.app
    scheme:
      testTargets:
        - MacTVTests
  MacTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacTVTests
    dependencies:
      - target: MacTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mactv.tests
